backend:
  name: github
  repo: kindomekklesias2052/kek-ministry
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  # 1. PDF & Document Downloads
  - name: "resources"
    label: "Ministry Resources & PDFs"
    folder: "content/resources"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Document Title", name: "title", widget: "string" }
      - { label: "Description / Summary", name: "description", widget: "text" }
      - { label: "Upload PDF File", name: "pdf_file", widget: "file" }
      - { label: "Publish Date", name: "date", widget: "datetime" }

  # 2. Photo Gallery Updates
  - name: "photos"
    label: "Photo Gallery"
    folder: "content/photos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Photo Caption / Title", name: "title", widget: "string" }
      - { label: "Event / Location", name: "location", widget: "string", default: "Territorial Circuit" }
      - { label: "Upload Image", name: "image", widget: "image" }
      - { label: "Date Taken / Uploaded", name: "date", widget: "datetime" }

  # 3. Video Gallery Updates (YouTube / Direct Videos)
  - name: "videos"
    label: "Video Gallery & Teachings"
    folder: "content/videos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Video Title", name: "title", widget: "string" }
      - { label: "Teaching / Event Description", name: "description", widget: "text" }
      - { label: "YouTube Video URL or Embed Link", name: "video_url", widget: "string" }
      - { label: "Upload Thumbnail Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }
