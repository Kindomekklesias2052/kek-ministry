<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Partner Prayer Dossier | Kingdom Ekklesias Koinonia (KEK)</title>
    <meta name="description" content="Confidential Prayer Dossier and Intake Form for Aaron & Hur Intercessory Covering under Kingdom Ekklesias Koinonia.">
    <meta name="author" content="Apostle Kamau Mwangi">

    <!-- Favicon Integration -->
    <link rel="icon" type="image/jpeg" href="IMG-20260706-WA0004.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <style>
        .form-page-wrapper {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 20px;
        }

        .form-header h1 {
            font-family: 'Cinzel', serif;
            color: var(--navy);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--slate);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 8px;
            font-size: 0.92rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--card-border);
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            color: #2d3748;
            background-color: #f8f9fa;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            background-color: #ffffff;
        }

        .btn-submit {
            background-color: var(--gold);
            color: var(--navy);
            font-weight: 700;
            padding: 14px 28px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--gold-hover);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .form-page-wrapper {
                margin: 20px 15px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION HEADER -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="IMG-20260706-WA0004.jpg" alt="KEK Emblem">
                KINGDOM EKKLESIAS <span>KOINONIA</span>
            </a>
            <nav>
                <a href="index.html#about">About</a>
                <a href="index.html#services">Pillars</a>
                <a href="index.html#courtroom-101">Courts 101</a>
                <a href="index.html#resources">Resources</a>
                <a href="index.html#forms">Forms</a>
                <a href="https://calendar.app.google/xPmrk5LuasqAE9rw7" target="_blank" class="btn-gold">Book Session</a>
            </nav>
        </div>
    </header>

    <!-- FORM CONTAINER -->
    <div class="form-page-wrapper">
        <div class="form-header">
            <h1>Partner Prayer Dossier</h1>
            <p>The Aaron & Hur Altar Initiative — Confidential Intake Form</p>
        </div>

        <!-- Secure Formspree Integration -->
        <form action="https://formspree.io/f/mppapvnl" method="POST">

            <!-- Custom Subject Line for Your Email Inbox -->
            <input type="hidden" name="_subject" value="New KEK Partner Intake Submission">

            <!-- Automatic Redirect Back to Homepage After Submission -->
            <input type="hidden" name="_next" value="https://kindomekklesias2052.github.io/kek-ministry/index.html">

            <!-- Hidden Anti-Spam Honeypot Field -->
            <input type="text" name="_gotcha" style="display:none">

            <!-- Personal Information -->
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="Full Name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="Email" required placeholder="your.email@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone / WhatsApp Number (With Country Code) *</label>
                <input type="tel" id="phone" name="Phone Number" required placeholder="+254 700 000 000">
            </div>

            <div class="form-group">
                <label for="location">City & Country of Residence *</label>
                <input type="text" id="location" name="Location" required placeholder="e.g., Nairobi, Kenya">
            </div>

            <!-- Partnership Selection -->
            <div class="form-group">
                <label for="tier">Select Partnership Tier *</label>
                <select id="tier" name="Partnership Tier" required>
                    <option value="" disabled selected>-- Select Partnership Tier --</option>
                    <option value="Covenant Partner ($200-$299/mo)">Covenant Partner ($200–$299/month)</option>
                    <option value="Kingdom Vanguard ($300-$449/mo)">Kingdom Vanguard ($300–$449/month)</option>
                    <option value="Shield Partner ($450-$1,000/mo)">Shield Partner ($450–$1,000/month)</option>
                    <option value="General Partner / Voluntary Contribution">General Partner / Voluntary Seed</option>
                </select>
            </div>

            <!-- Confidential Prayer Requests -->
            <div class="form-group">
                <label for="personalDossier">Personal & Family Prayer Dossier *</label>
                <textarea id="personalDossier" name="Personal Prayer Requests" required placeholder="Detail key family timelines, health goals, or bloodline situations for intercessory coverage..."></textarea>
            </div>

            <div class="form-group">
                <label for="businessDossier">Enterprise, Career, or Ministry Goals</label>
                <textarea id="businessDossier" name="Business and Ministry Goals" placeholder="Detail business dockets, career doors, or territorial assignments..."></textarea>
            </div>

            <!-- Submission Button -->
            <button type="submit" class="btn-submit">Submit Confidential Dossier</button>
        </form>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Kingdom Ekklesias Koinonia (KEK). All Rights Reserved. | <a href="privacy.html" style="color: #718096; text-decoration: underline;">Privacy Policy</a></p>
    </footer>

</body>
</html>
